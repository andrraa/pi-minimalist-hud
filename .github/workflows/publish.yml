name: publish

# Tag push `v0.2.0` publishes `@mrwyck/pi-minimalist-hud@0.2.0`.
# Uses npm trusted publishing (OIDC) — no NPM_TOKEN secret required.
# Configure once: npmjs.com -> package -> Settings -> Trusted Publisher -> GitHub Actions,
# repository `andrraa/pi-minimalist-hud`, workflow `publish.yml`.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install --no-audit --no-fund

      # Trusted publishing needs npm >= 11.5.1; older runners ship less.
      - run: npm install -g npm@latest

      # Tags and package.json drift apart easily; publishing the wrong
      # version is not undoable, so fail before npm sees the tag.
      - name: Check tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm test
      - run: npm run typecheck

      - run: npm publish --provenance